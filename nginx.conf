<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketFlow – Project Management</title>
  <link rel="icon" id="app-favicon" href="">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Login Page -->
    <div id="login-page" class="page active">
      <div class="login-container">
        <div class="login-card">
          <div class="login-header">
            <div class="logo">🎫 TicketFlow</div>
            <p>Sign in to your account</p>
          </div>
          <form id="login-form">
            <div class="form-group">
              <label>Username</label>
              <input type="text" id="login-username" placeholder="admin" required>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
            <div id="login-error" class="error-msg hidden"></div>
          </form>
        </div>
      </div>
    </div>

    <!-- Main App Shell -->
    <div id="app-shell" class="hidden">
      <nav class="sidebar">
        <div class="sidebar-header">
          <div class="logo">🎫 TicketFlow</div>
        </div>
        <ul class="nav-menu">
          <li><a href="#" data-page="dashboard" class="nav-link active">📊 Dashboard</a></li>
          <li><a href="#" data-page="tickets" class="nav-link">🎟️ Tickets</a></li>
          <li><a href="#" data-page="wiki" class="nav-link">📚 Wiki</a></li>
          <li><a href="#" data-page="epics" class="nav-link">🏔️ Epics</a></li>
          <li><a href="#" data-page="sprints" class="nav-link">🏃 Sprints</a></li>
          <li><a href="#" data-page="profile" class="nav-link">🔑 Profile</a></li>
          <li><a href="#" data-page="users" class="nav-link admin-only">👥 Users</a></li>
          <li><a href="#" data-page="discord-notifications" class="nav-link admin-only">📢 Discord Notifications</a></li>
          <li><a href="#" data-page="settings" class="nav-link admin-only">⚙️ Settings</a></li>
        </ul>
        <div class="sidebar-footer">
          <div class="user-info">
            <span id="sidebar-user-avatar"></span>
            <div class="user-info-text">
              <span id="current-user-name"></span>
              <span id="current-user-role" class="badge"></span>
            </div>
          </div>
          <button id="logout-btn" class="btn btn-sm">Logout</button>
        </div>
      </nav>

      <main class="main-content">
        <!-- Dashboard -->
        <div id="page-dashboard" class="page-content active">
          <div class="page-header"><h1>Dashboard</h1></div>
          <div class="stats-grid" id="dashboard-stats"></div>
          <div class="dashboard-grid">
            <div class="card">
              <h3>Recent Tickets</h3>
              <div id="recent-tickets"></div>
            </div>
            <div class="card">
              <h3>Active Sprint</h3>
              <div id="active-sprint-info"></div>
            </div>
          </div>
        </div>

        <!-- Tickets -->
        <div id="page-tickets" class="page-content">
          <div class="page-header">
            <h1>Tickets</h1>
            <button class="btn btn-primary" onclick="openCreateTicketModal()">+ New Ticket</button>
          </div>
          <div class="filters-bar">
            <input type="text" id="ticket-search" placeholder="Search tickets..." class="input-sm">
            <select id="filter-status" class="input-sm"><option value="">All Status</option><option>Open</option><option>In Progress</option><option>Closed</option></select>
            <select id="filter-priority" class="input-sm"><option value="">All Priority</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select>
            <select id="filter-epic" class="input-sm"><option value="">All Epics</option></select>
            <select id="filter-sprint" class="input-sm"><option value="">All Sprints</option></select>
          </div>
          <div id="tickets-list" class="tickets-table"></div>
        </div>

        <!-- Ticket Detail -->
        <div id="page-ticket-detail" class="page-content">
          <div class="page-header">
            <button class="btn btn-sm" onclick="showPage('tickets')">← Back to Tickets</button>
            <div class="ticket-actions" id="ticket-detail-actions"></div>
          </div>
          <div id="ticket-detail-content" class="ticket-detail-layout"></div>
        </div>

        <!-- Wiki -->
        <div id="page-wiki" class="page-content">
          <div class="page-header">
            <h1>Wiki Knowledge Base</h1>
            <button class="btn btn-primary" onclick="openCreateWikiModal()">+ New Article</button>
          </div>
          <div class="filters-bar">
            <input type="text" id="wiki-search" placeholder="Search articles..." class="input-sm">
            <select id="wiki-category-filter" class="input-sm"><option value="">All Categories</option></select>
          </div>
          <div id="wiki-list" class="wiki-grid"></div>
        </div>

        <!-- Wiki Detail -->
        <div id="page-wiki-detail" class="page-content">
          <div class="page-header">
            <button class="btn btn-sm" onclick="showPage('wiki')">← Back to Wiki</button>
            <div id="wiki-detail-actions"></div>
          </div>
          <div id="wiki-detail-content"></div>
        </div>

        <!-- Epics -->
        <div id="page-epics" class="page-content">
          <div class="page-header">
            <h1>Epics</h1>
            <button class="btn btn-primary" onclick="openCreateEpicModal()">+ New Epic</button>
          </div>
          <div id="epics-list" class="epics-grid"></div>
        </div>

        <!-- Sprints -->
        <div id="page-sprints" class="page-content">
          <div class="page-header">
            <h1>Sprints</h1>
            <button class="btn btn-primary" onclick="openCreateSprintModal()">+ New Sprint</button>
          </div>
          <div id="sprints-list" class="sprints-grid"></div>
        </div>

        <!-- Profile / Change Password -->
        <div id="page-profile" class="page-content">
          <div class="page-header"><h1>My Profile</h1></div>
          <div class="settings-container">
            <div class="card">
              <h3>🖼️ Avatar</h3>
              <p class="text-muted">Personalize your account with an avatar. Paste an image URL or upload an image (PNG, JPG, GIF, WEBP – max 5MB).</p>
              <div class="avatar-edit-row">
                <div id="profile-avatar-preview"></div>
                <div class="avatar-edit-fields">
                  <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="avatar-url-input" placeholder="https://cdn.pixabay.com/photo/2020/07/01/12/58/icon-5359553_640.png" class="input-full">
                  </div>
                  <div class="form-group">
                    <label>Or upload an image</label>
                    <input type="file" id="avatar-file-input" accept="image/png,image/jpeg,image/gif,image/webp">
                  </div>
                  <div class="btn-group">
                    <button class="btn btn-primary" onclick="saveAvatar()">Save Avatar</button>
                    <button class="btn btn-secondary" onclick="removeAvatar()">Remove</button>
                  </div>
                </div>
              </div>
              <div id="avatar-msg" class="msg hidden"></div>
            </div>
            <div class="card" style="margin-top:1rem">
              <h3>👤 Account Info</h3>
              <div id="profile-info"></div>
            </div>
            <div class="card" style="margin-top:1rem">
              <h3>🔒 Change Password</h3>
              <p class="text-muted">Update your password. You must provide your current password for verification.</p>
              <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="cp-current" placeholder="Enter current password" class="input-full">
              </div>
              <div class="form-group">
                <label>New Password</label>
                <input type="password" id="cp-new" placeholder="At least 6 characters" class="input-full">
              </div>
              <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="cp-confirm" placeholder="Re-enter new password" class="input-full">
              </div>
              <div class="btn-group">
                <button class="btn btn-primary" onclick="submitChangePassword()">Update Password</button>
              </div>
              <div id="cp-msg" class="msg hidden"></div>
            </div>
          </div>
        </div>

        <!-- Users (admin) -->
        <div id="page-users" class="page-content">
          <div class="page-header">
            <h1>User Management</h1>
            <button class="btn btn-primary" onclick="openCreateUserModal()">+ Add User</button>
          </div>
          <div id="users-list" class="users-table"></div>
        </div>

        <!-- Settings (admin) -->
        <div id="page-settings" class="page-content">
          <div class="page-header"><h1>Settings</h1></div>
          <div class="settings-container">
            <div class="card">
              <h3>🎨 Branding</h3>
              <p class="text-muted">Customize the look of your workspace. Changes apply across the app for everyone.</p>
              <div class="form-group">
                <label>Company / App Name</label>
                <input type="text" id="brand-name" placeholder="TicketFlow" class="input-full" maxlength="60">
              </div>
              <!-- Logo -->
              <div class="form-group brand-asset" data-kind="logo">
                <label>Logo <span class="text-muted" style="margin:0">(shown in the sidebar)</span></label>
                <div class="brand-asset-row">
                  <div class="brand-asset-preview" id="brand-logo-preview" title="Current logo"></div>
                  <div class="brand-asset-controls">
                    <div class="brand-dropzone" id="brand-logo-dropzone" tabindex="0" role="button" aria-label="Upload logo">
                      <input type="file" id="brand-logo-file" accept="image/png,image/jpeg,image/svg+xml,image/x-icon,image/vnd.microsoft.icon,image/gif" hidden>
                      <div class="brand-dropzone-icon">🖼️</div>
                      <div class="brand-dropzone-text">Drag &amp; drop or <strong>click to upload</strong></div>
                      <div class="brand-dropzone-hint">PNG, JPG, SVG, ICO, GIF · max 5MB</div>
                    </div>
                    <div class="brand-upload-status hidden" id="brand-logo-status"></div>
                    <div class="brand-source-row">
                      <span class="brand-source-badge none" id="brand-logo-source">No logo set</span>
                      <a href="#" class="brand-url-link" id="brand-logo-urltoggle" onclick="toggleBrandUrl('logo'); return false;">Or enter a URL</a>
                    </div>
                    <input type="url" id="brand-logo-url" placeholder="https://i.pinimg.com/originals/f7/53/6e/f7536e6982e4f1ddbbcb217fa9cbc0a1.png" class="input-full brand-url-input hidden">
                  </div>
                </div>
              </div>
              <!-- Favicon -->
              <div class="form-group brand-asset" data-kind="favicon">
                <label>Favicon <span class="text-muted" style="margin:0">(browser tab icon)</span></label>
                <div class="brand-asset-row">
                  <div class="brand-asset-preview" id="brand-favicon-preview" title="Current favicon"></div>
                  <div class="brand-asset-controls">
                    <div class="brand-dropzone" id="brand-favicon-dropzone" tabindex="0" role="button" aria-label="Upload favicon">
                      <input type="file" id="brand-favicon-file" accept="image/png,image/jpeg,image/svg+xml,image/x-icon,image/vnd.microsoft.icon,image/gif" hidden>
                      <div class="brand-dropzone-icon">🔖</div>
                      <div class="brand-dropzone-text">Drag &amp; drop or <strong>click to upload</strong></div>
                      <div class="brand-dropzone-hint">PNG, JPG, SVG, ICO, GIF · max 5MB</div>
                    </div>
                    <div class="brand-upload-status hidden" id="brand-favicon-status"></div>
                    <div class="brand-source-row">
                      <span class="brand-source-badge none" id="brand-favicon-source">No favicon set</span>
                      <a href="#" class="brand-url-link" id="brand-favicon-urltoggle" onclick="toggleBrandUrl('favicon'); return false;">Or enter a URL</a>
                    </div>
                    <input type="url" id="brand-favicon-url" placeholder="https://upload.wikimedia.org/wikipedia/commons/2/22/Wikipedia_favicon_in_Firefox_on_KDE_%282023%29.png" class="input-full brand-url-input hidden">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label>Primary Brand Color</label>
                <div class="color-field">
                  <input type="color" id="brand-primary-color" value="#6366f1" class="color-swatch">
                  <input type="text" id="brand-primary-color-text" placeholder="#6366f1" class="input-full" maxlength="7">
                </div>
              </div>
              <div class="btn-group">
                <button class="btn btn-primary" onclick="saveBranding()">Save Branding</button>
                <button class="btn btn-secondary" onclick="resetBrandingDefaults()">Reset to Defaults</button>
              </div>
              <div id="branding-msg" class="msg hidden"></div>
            </div>
            <div class="card" style="margin-top:1rem">
              <h3>🔔 Discord Integration</h3>
              <p class="text-muted">Configure a Discord webhook to receive ticket notifications.</p>
              <div class="form-group">
                <label>Webhook URL</label>
                <input type="url" id="discord-webhook-url" placeholder="https://discord.com/api/webhooks/..." class="input-full">
              </div>
              <div class="btn-group">
                <button class="btn btn-primary" onclick="saveDiscordWebhook()">Save</button>
                <button class="btn btn-secondary" onclick="testDiscordWebhook()">Test Notification</button>
              </div>
              <div id="settings-msg" class="msg hidden"></div>
            </div>
          </div>
        </div>

        <!-- Discord Notifications -->
        <div id="page-discord-notifications" class="page-content">
          <div class="page-header">
            <div>
              <h1>📢 Discord Notifications</h1>
              <p class="text-muted" style="margin:.25rem 0 0">Configure exactly which events post to Discord and how each message looks.</p>
            </div>
            <button class="btn btn-secondary" onclick="expandAllDiscord()" id="discord-expand-toggle">Expand all</button>
          </div>
          <div id="discord-default-banner" class="dn-banner hidden"></div>
          <div id="discord-config-list" class="dn-list">
            <p class="text-muted">Loading…</p>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal" id="modal-container">
        <div class="modal-header">
          <h2 id="modal-title"></h2>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
