services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickets_db
      POSTGRES_USER: tickets_user
      POSTGRES_PASSWORD: tickets_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets_user -d tickets_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tickets_user:tickets_pass@postgres:5432/tickets_db
      JWT_SECRET: super-secret-jwt-key-change-me
      PORT: 4001
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "4001:4001"
    healthcheck:
      # Uses node (always present in the image) to hit the health endpoint.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      # Wait until the backend is actually healthy (listening + DB ready) so the
      # "backend" hostname resolves before nginx loads its config. Prevents the
      # "host not found in upstream 'backend'" startup failure.
      backend:
        condition: service_healthy
    ports:
      - "3003:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - uploads_data:/usr/share/nginx/uploads:ro

volumes:
  pg_data:
  uploads_data:
